<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TOEIC">
<meta name="theme-color" content="#f5f3ee">
<title>TOEIC Daily Trainer</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f3ee; --surface: #ffffff; --surface2: #edeae3;
    --border: rgba(0,0,0,0.08); --border2: rgba(0,0,0,0.15);
    --text: #1a1814; --muted: #7a7670;
    --accent: #2563eb; --accent-dim: rgba(37,99,235,0.08);
    --success: #16a34a; --success-dim: rgba(22,163,74,0.08);
    --danger: #dc2626; --danger-dim: rgba(220,38,38,0.08);
    --mono: 'DM Mono', monospace; --sans: 'Noto Sans JP', sans-serif;
    --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); -webkit-font-smoothing: antialiased; overscroll-behavior: none; }
  body { display: flex; flex-direction: column; min-height: 100dvh; padding-top: var(--safe-top); padding-bottom: var(--safe-bottom); }
  .screen { display: none; flex-direction: column; flex: 1; overflow: hidden; }
  .screen.active { display: flex; }

  /* HEADER */
  .app-header { padding: 20px 20px 0; display: flex; align-items: flex-start; justify-content: space-between; flex-shrink: 0; }
  .score-badge { display: inline-flex; align-items: center; gap: 6px; background: var(--accent-dim); border: 1px solid rgba(37,99,235,0.2); border-radius: 99px; padding: 4px 12px; font-family: var(--mono); font-size: 11px; color: var(--accent); letter-spacing: 0.05em; margin-bottom: 8px; }
  .app-title { font-size: 22px; font-weight: 700; line-height: 1.1; letter-spacing: -0.02em; }
  .app-title span { color: var(--accent); }
  .streak-counter { text-align: right; }
  .streak-num { font-family: var(--mono); font-size: 32px; font-weight: 500; color: var(--accent); line-height: 1; }
  .streak-label { font-size: 10px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; margin-top: 2px; }

  /* DATE NAV */
  .date-nav { display: flex; align-items: center; margin: 20px 20px 0; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; flex-shrink: 0; }
  .nav-btn { background: none; border: none; color: var(--muted); padding: 10px 16px; cursor: pointer; font-size: 16px; flex-shrink: 0; }
  .nav-btn:active { background: var(--surface2); }
  .nav-btn:disabled { opacity: 0.2; cursor: default; }
  .date-display { flex: 1; text-align: center; font-family: var(--mono); font-size: 13px; color: var(--text); letter-spacing: 0.03em; }
  .date-today-label { display: block; font-size: 10px; color: var(--accent); letter-spacing: 0.1em; text-transform: uppercase; margin-top: 1px; }

  /* MODE TOGGLE */
  .mode-toggle { display: flex; gap: 8px; margin: 12px 20px 0; flex-shrink: 0; }
  .mode-btn { flex: 1; padding: 10px 8px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--muted); font-family: var(--sans); font-size: 13px; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .mode-btn svg { width: 14px; height: 14px; flex-shrink: 0; }
  .mode-btn.active { background: var(--accent-dim); border-color: rgba(37,99,235,0.3); color: var(--accent); font-weight: 500; }
  .mode-btn:disabled { opacity: 0.4; cursor: default; }

  /* TASK LIST */
  .task-scroll { flex: 1; overflow-y: auto; padding: 12px 20px 0; -webkit-overflow-scrolling: touch; }
  .task-item { display: flex; align-items: center; gap: 14px; padding: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; margin-bottom: 8px; cursor: pointer; -webkit-tap-highlight-color: transparent; user-select: none; }
  .task-item:active { background: var(--surface2); }
  .task-item.done { border-color: rgba(22,163,74,0.2); background: var(--success-dim); }
  .task-item.done .task-name { color: var(--muted); text-decoration: line-through; }
  .task-check { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--border2); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .task-item.done .task-check { background: var(--success); border-color: var(--success); }
  .check-icon { display: none; width: 14px; height: 14px; stroke: #fff; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .task-item.done .check-icon { display: block; }
  .task-body { flex: 1; min-width: 0; }
  .task-name { font-size: 14px; font-weight: 500; color: var(--text); margin-bottom: 2px; }
  .task-hint { font-size: 11px; color: var(--muted); }
  .task-time { font-family: var(--mono); font-size: 11px; color: var(--muted); flex-shrink: 0; background: var(--surface2); padding: 3px 8px; border-radius: 6px; }
  .task-item.done .task-time { background: rgba(22,163,74,0.1); color: var(--success); }

  /* QUIZ LAUNCH */
  .quiz-launch { display: flex; align-items: center; gap: 10px; padding: 14px 16px; background: var(--accent-dim); border: 1px solid rgba(37,99,235,0.2); border-radius: 14px; margin-bottom: 8px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .quiz-launch:active { opacity: 0.8; }
  .quiz-launch-icon { width: 34px; height: 34px; border-radius: 8px; background: var(--accent); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .quiz-launch-icon svg { width: 18px; height: 18px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; }
  .quiz-launch-body { flex: 1; }
  .quiz-launch-name { font-size: 14px; font-weight: 500; color: var(--accent); }
  .quiz-launch-hint { font-size: 11px; color: var(--muted); margin-top: 1px; }
  .quiz-launch-time { font-family: var(--mono); font-size: 11px; color: var(--accent); background: rgba(37,99,235,0.1); padding: 3px 8px; border-radius: 6px; flex-shrink: 0; }
  .quiz-launch.done { background: var(--success-dim); border-color: rgba(22,163,74,0.2); }
  .quiz-launch.done .quiz-launch-icon { background: var(--success); }
  .quiz-launch.done .quiz-launch-name { color: var(--success); }
  .quiz-launch.done .quiz-launch-time { background: rgba(22,163,74,0.1); color: var(--success); }
  .quiz-score-badge { font-size: 11px; color: var(--success); font-family: var(--mono); }
  .all-done { display: none; text-align: center; padding: 24px 16px; }
  .all-done.show { display: block; }
  .all-done-icon { font-size: 40px; margin-bottom: 8px; }
  .all-done-text { font-size: 16px; font-weight: 700; color: var(--accent); margin-bottom: 4px; }
  .all-done-sub { font-size: 12px; color: var(--muted); }

  /* BOTTOM */
  .bottom-section { padding: 12px 20px 16px; flex-shrink: 0; }
  .progress-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .progress-label { font-size: 11px; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
  .progress-pct { font-family: var(--mono); font-size: 13px; color: var(--accent); font-weight: 500; }
  .progress-track { height: 4px; background: var(--surface2); border-radius: 99px; overflow: hidden; margin-bottom: 16px; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 99px; transition: width 0.4s cubic-bezier(0.34,1.56,0.64,1); width: 0%; }
  .week-label { font-size: 11px; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 8px; }
  .week-dots { display: flex; gap: 6px; }
  .week-dot { flex: 1; aspect-ratio: 1; max-width: 40px; border-radius: 8px; background: var(--surface); border: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  .week-dot.done { background: var(--success-dim); border-color: rgba(22,163,74,0.25); }
  .week-dot.today { border-color: rgba(37,99,235,0.4); }
  .dot-day { font-size: 9px; color: var(--muted); letter-spacing: 0.05em; font-family: var(--mono); }
  .week-dot.done .dot-day { color: var(--success); }
  .week-dot.today .dot-day { color: var(--accent); }
  .dot-icon { width: 12px; height: 12px; stroke: var(--border2); stroke-width: 1.5; fill: none; }
  .week-dot.done .dot-icon { stroke: var(--success); }
  .week-dot.today .dot-icon { stroke: var(--accent); }

  /* QUIZ SCREEN */
  .quiz-header { padding: 16px 20px 0; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .quiz-back { background: none; border: 1px solid var(--border); border-radius: 10px; padding: 8px 14px; font-size: 13px; color: var(--muted); cursor: pointer; display: flex; align-items: center; gap: 6px; font-family: var(--sans); }
  .quiz-back svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }
  .quiz-back:active { background: var(--surface2); }
  .quiz-title { font-size: 15px; font-weight: 500; color: var(--text); }
  .quiz-progress-bar { margin: 12px 20px 0; height: 4px; background: var(--surface2); border-radius: 99px; overflow: hidden; flex-shrink: 0; }
  .quiz-progress-fill { height: 100%; background: var(--accent); border-radius: 99px; transition: width 0.3s ease; }
  .quiz-body { flex: 1; overflow-y: auto; padding: 20px; -webkit-overflow-scrolling: touch; }
  .q-meta { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-bottom: 10px; }
  .q-num { color: var(--accent); }
  
  .q-passage-details { margin-bottom: 12px; }
  .q-passage-details[open] .q-passage-summary { color: var(--accent); }
  .q-passage-summary { font-size: 13px; font-weight: 500; color: var(--muted); cursor: pointer; padding: 10px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; list-style: none; display: flex; align-items: center; gap: 6px; -webkit-tap-highlight-color: transparent; user-select: none; }
  .q-passage-summary::-webkit-details-marker { display: none; }
  .q-passage-details[open] .q-passage-summary { border-bottom-left-radius: 0; border-bottom-right-radius: 0; border-bottom: none; }
  .q-passage-details[open] .q-passage { border-top-left-radius: 0; border-top-right-radius: 0; margin-bottom: 0; border-top: none; }
  .q-passage-details .q-passage { margin-bottom: 0; border-radius: 0 0 10px 10px; }
  .q-passage { font-size: 13px; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 12px; line-height: 1.8; white-space: pre-wrap; }
  .q-text { font-size: 15px; line-height: 1.7; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 16px; }
  .q-choices { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
  .q-choice { display: flex; align-items: flex-start; gap: 12px; padding: 14px; background: var(--surface); border: 1.5px solid var(--border); border-radius: 12px; cursor: pointer; -webkit-tap-highlight-color: transparent; transition: border-color 0.15s; }
  .q-choice:active { background: var(--surface2); }
  .q-choice.correct { border-color: var(--success); background: var(--success-dim); }
  .q-choice.wrong { border-color: var(--danger); background: var(--danger-dim); }
  .q-choice-label { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--border2); display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 11px; color: var(--muted); flex-shrink: 0; }
  .q-choice.correct .q-choice-label { background: var(--success); border-color: var(--success); color: #fff; }
  .q-choice.wrong .q-choice-label { background: var(--danger); border-color: var(--danger); color: #fff; }
  .q-choice-text { font-size: 14px; color: var(--text); line-height: 1.5; flex: 1; padding-top: 2px; }
  .q-result-icon { font-size: 16px; margin-left: auto; flex-shrink: 0; }
  .q-explanation { background: var(--accent-dim); border: 1px solid rgba(37,99,235,0.15); border-radius: 12px; padding: 14px; margin-bottom: 16px; font-size: 13px; line-height: 1.7; color: var(--text); display: none; }
  .q-explanation.show { display: block; }
  .q-exp-label { font-size: 10px; font-weight: 500; color: var(--accent); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.06em; font-family: var(--mono); }
  .q-nav { display: flex; gap: 10px; }
  .q-btn { flex: 1; padding: 14px; border-radius: 12px; border: 1.5px solid var(--accent); background: var(--accent); color: #fff; font-family: var(--sans); font-size: 14px; font-weight: 500; cursor: pointer; }
  .q-btn:active { opacity: 0.85; }
  .q-btn:disabled { opacity: 0.35; cursor: default; }

  /* RESULT SCREEN */
  .result-body { flex: 1; overflow-y: auto; padding: 24px 20px; -webkit-overflow-scrolling: touch; }
  .result-score-card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 28px 20px; text-align: center; margin-bottom: 20px; }
  .result-score-label { font-size: 12px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; font-family: var(--mono); margin-bottom: 8px; }
  .result-score-num { font-family: var(--mono); font-size: 56px; font-weight: 500; line-height: 1; }
  .result-score-total { font-size: 18px; color: var(--muted); }
  .result-score-pct { font-size: 14px; color: var(--muted); margin-top: 6px; }
  .result-score-msg { font-size: 15px; font-weight: 500; margin-top: 12px; }
  .result-breakdown-title { font-size: 12px; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; font-family: var(--mono); margin-bottom: 12px; }
  .review-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 8px; overflow: hidden; }
  .review-card.wrong { border-color: rgba(220,38,38,0.25); }
  .review-card.correct-card { border-color: rgba(22,163,74,0.15); }
  .review-header { display: flex; align-items: center; gap: 10px; padding: 12px 14px; cursor: pointer; -webkit-tap-highlight-color: transparent; user-select: none; }
  .review-ox { font-size: 15px; flex-shrink: 0; }
  .review-qnum { font-family: var(--mono); font-size: 11px; color: var(--muted); flex-shrink: 0; min-width: 24px; }
  .review-qtext { flex: 1; font-size: 13px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .review-chevron { font-size: 11px; color: var(--muted); flex-shrink: 0; transition: transform 0.2s; display: inline-block; }
  .review-card.open .review-chevron { transform: rotate(180deg); }
  .review-detail { display: none; padding: 0 14px 14px; border-top: 1px solid var(--border); }
  .review-card.open .review-detail { display: block; }
  .review-passage { font-size: 12px; color: var(--text); background: var(--bg); border-radius: 8px; padding: 10px 12px; margin: 10px 0 8px; line-height: 1.7; white-space: pre-wrap; }
  .review-full-q { font-size: 14px; color: var(--text); margin: 10px 0; line-height: 1.6; font-weight: 500; }
  .review-choices-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
  .review-choice-row { display: flex; align-items: flex-start; gap: 8px; padding: 8px 10px; border-radius: 8px; font-size: 13px; line-height: 1.5; border: 1px solid transparent; }
  .review-choice-row.is-correct { background: var(--success-dim); border-color: rgba(22,163,74,0.2); }
  .review-choice-row.is-wrong-pick { background: var(--danger-dim); border-color: rgba(220,38,38,0.2); }
  .review-choice-label { font-family: var(--mono); font-size: 11px; flex-shrink: 0; margin-top: 2px; font-weight: 500; color: var(--muted); }
  .review-choice-row.is-correct .review-choice-label { color: var(--success); }
  .review-choice-row.is-wrong-pick .review-choice-label { color: var(--danger); }
  .review-choice-text { flex: 1; color: var(--text); }
  .review-choice-row.is-correct .review-choice-text { color: var(--success); font-weight: 500; }
  .review-choice-row.is-wrong-pick .review-choice-text { color: var(--danger); }
  .review-exp-box { background: var(--accent-dim); border-radius: 8px; padding: 10px 12px; font-size: 13px; line-height: 1.7; color: var(--text); }
  .review-exp-label { font-size: 10px; color: var(--accent); font-family: var(--mono); font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 4px; }
  .result-done-btn { width: 100%; padding: 16px; border-radius: 14px; background: var(--accent); color: #fff; border: none; font-family: var(--sans); font-size: 15px; font-weight: 500; cursor: pointer; margin-top: 4px; }
  .result-done-btn:active { opacity: 0.85; }

  .vocab-body { flex: 1; overflow-y: auto; padding: 20px; -webkit-overflow-scrolling: touch; }
  .vocab-card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 32px 20px; text-align: center; margin-bottom: 16px; min-height: 200px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .vocab-word { font-size: 28px; font-weight: 700; color: var(--text); margin-bottom: 8px; letter-spacing: -0.01em; }
  .vocab-pos { font-size: 12px; color: var(--muted); font-family: var(--mono); margin-bottom: 16px; }
  .vocab-meaning { font-size: 18px; color: var(--accent); font-weight: 500; margin-bottom: 12px; }
  .vocab-example { font-size: 13px; color: var(--muted); line-height: 1.6; font-style: italic; }
  .vocab-example-ja { font-size: 12px; color: var(--muted); margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border); line-height: 1.5; width: 100%; text-align: center; }
  .vocab-progress-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .vocab-progress-label { font-size: 11px; color: var(--muted); font-family: var(--mono); }
  .vocab-nav { display: flex; gap: 10px; }
  .vocab-btn { flex: 1; padding: 14px; border-radius: 12px; border: 1.5px solid var(--border); background: var(--surface); color: var(--text); font-family: var(--sans); font-size: 14px; font-weight: 500; cursor: pointer; }
  .vocab-btn:active { opacity: 0.85; }
  .vocab-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .vocab-done-msg { text-align: center; padding: 20px; }
  .vocab-launch { display: flex; align-items: center; gap: 10px; padding: 14px 16px; background: rgba(37,99,235,0.06); border: 1px solid rgba(37,99,235,0.15); border-radius: 14px; margin-bottom: 8px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .vocab-launch:active { opacity: 0.8; }
  .vocab-launch-icon { width: 34px; height: 34px; border-radius: 8px; background: #7c3aed; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .vocab-launch-icon svg { width: 18px; height: 18px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; }
  .vocab-launch-body { flex: 1; }
  .vocab-launch-name { font-size: 14px; font-weight: 500; color: #7c3aed; }
  .vocab-launch-hint { font-size: 11px; color: var(--muted); margin-top: 1px; }
  .vocab-launch-time { font-family: var(--mono); font-size: 11px; color: #7c3aed; background: rgba(124,58,237,0.08); padding: 3px 8px; border-radius: 6px; flex-shrink: 0; }
  .vocab-launch.done { background: var(--success-dim); border-color: rgba(22,163,74,0.2); cursor: default; }
  .vocab-launch.done .vocab-launch-icon { background: var(--success); }
  .vocab-launch.done .vocab-launch-name { color: var(--success); }
  .vocab-launch.done .vocab-launch-time { background: rgba(22,163,74,0.1); color: var(--success); }
  .q-translation { font-size: 12px; color: var(--muted); background: var(--surface2); border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; line-height: 1.6; }
  .review-translation { font-size: 12px; color: var(--muted); margin-bottom: 10px; line-height: 1.5; background: var(--surface2); border-radius: 6px; padding: 6px 8px; }
</style>
</head>
<body>

<!-- HOME -->
<div class="screen active" id="screen-home">
  <header class="app-header">
    <div>
      <div class="score-badge">600 <span style="opacity:.6;font-size:10px">→</span> 700+</div>
      <h1 class="app-title">TOEIC<br><span>Daily</span> Trainer</h1>
    </div>
    <div class="streak-counter">
      <div class="streak-num" id="streak-num">0</div>
      <div class="streak-label">日連続</div>
    </div>
  </header>
  <div class="date-nav">
    <button class="nav-btn" id="prev-btn" onclick="changeDay(-1)">&#8249;</button>
    <div class="date-display">
      <span id="date-text">---</span>
      <span class="date-today-label" id="today-label"></span>
    </div>
    <button class="nav-btn" id="next-btn" onclick="changeDay(1)" disabled>&#8250;</button>
  </div>
  <div class="mode-toggle">
    <button class="mode-btn" id="btn-30" onclick="setMode('30')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      30分コース
    </button>
    <button class="mode-btn" id="btn-60" onclick="setMode('60')">

  {q:'The ___ of the product depends on customer feedback.',choices:["A. succeed", "B. successful", "C. successfully", "D. success"],answer:3,translation:'製品の成功は顧客のフィードバックにかかっています。',explanation:'冠詞 The の後ろには名詞が来ます。success（成功）が正解。'},
  {q:'Please ensure the report is ___ before the 3 PM deadline.',choices:["A. complete", "B. completed", "C. completing", "D. completely"],answer:1,translation:'午後3時の締め切り前にレポートが完成していることを確認してください。',explanation:'is の補語として「完成された状態」を表す completed（完成した）が正解。'},
  {q:'The workshop is designed ___ employees develop leadership skills.',choices:["A. help", "B. helping", "C. to help", "D. helped"],answer:2,translation:'ワークショップは社員がリーダーシップスキルを伸ばすのを助けるように設計されています。',explanation:'is designed to do で「〜するように設計されている」。to help が正解。'},
  {q:'Participants ___ register in advance to attend the event.',choices:["A. are required to", "B. are requiring", "C. require", "D. requiring"],answer:0,translation:'参加者はイベントに参加するために事前に登録することが求められます。',explanation:'「事前登録が必要です」という受動態の表現。are required to が正解。'},
  {q:'The company has seen a significant ___ in overseas sales.',choices:["A. increase", "B. increasing", "C. increased", "D. increasingly"],answer:0,translation:'会社は海外売上に著しい増加を見てきました。',explanation:'冠詞 a と前置詞 in の間には名詞が来ます。increase（増加）が正解。'},
  {q:'___ the new system is in place, processing time will be reduced.',choices:["A. Once", "B. Although", "C. Despite", "D. Unless"],answer:0,translation:'新システムが導入されれば、処理時間が短縮されます。',explanation:'「新システムが導入されれば〜」という条件・時間を表す Once（一旦〜したら）が正解。'},
  {q:'The contract will ___ automatically unless either party objects.',choices:["A. renew", "B. be renewing", "C. be renewed", "D. renewing"],answer:2,translation:'どちらの当事者も異議を申し立てない限り、契約は自動的に更新されます。',explanation:'契約は「更新される」受け身の関係。will be renewed が正解。'},
  {q:'Ms. Tanaka is responsible ___ managing the company\'s social media.',choices:["A. of", "B. for", "C. with", "D. to"],answer:1,translation:'田中さんは会社のSNS管理を担当しています。',explanation:'be responsible for〜で「〜の責任を持つ」という定型表現。'},
  {q:'The feedback from the survey was ___ positive.',choices:["A. overwhelm", "B. overwhelmed", "C. overwhelming", "D. overwhelmingly"],answer:3,translation:'調査からのフィードバックは圧倒的にポジティブでした。',explanation:'形容詞 positive を修飾するには副詞が必要。overwhelmingly（圧倒的に）が正解。'},
  {q:'We regret to ___ that the event has been canceled.',choices:["A. inform", "B. information", "C. informed", "D. informing"],answer:0,translation:'イベントがキャンセルになったことをお知らせすることを残念に思います。',explanation:'regret to do で「〜することを残念に思う」。to の後ろは動詞の原形 inform が正解。'},
  {q:'The ___ for the position closed last Friday.',choices:["A. apply", "B. applied", "C. application", "D. applicant"],answer:2,translation:'そのポジションへの応募は先週金曜日に締め切られました。',explanation:'冠詞 The の後ろには名詞が来ます。application（応募・申請）が正解。'},
  {q:'The company ___ its headquarters to a larger office building.',choices:["A. move", "B. moved", "C. is moving", "D. will moving"],answer:2,translation:'会社はより大きなオフィスビルに本社を移転しています。',explanation:'現在進行中の予定を表す is moving が文脈に合います。'},
  {q:'___ to the schedule, the product will be released in June.',choices:["A. According", "B. Regard", "C. Concerning", "D. As"],answer:0,translation:'スケジュールによると、製品は6月にリリースされる予定です。',explanation:'According to〜で「〜によると・〜に従って」という定型表現。'},
  {q:'The sales team ___ its monthly target for three consecutive months.',choices:["A. exceeded", "B. exceeding", "C. to exceed", "D. exceed"],answer:0,translation:'営業チームは3ヶ月連続で月間目標を超えました。',explanation:'過去の事実を述べる文。過去形 exceeded が正解。'},
  {q:'The new regulation ___ effect on all companies operating in this region.',choices:["A. take", "B. takes", "C. taking", "D. taken"],answer:1,translation:'新しい規制はこの地域で事業を行う全企業に効力を発します。',explanation:'主語 The new regulation は三人称単数なので三単現の takes が正解。take effect で「施行される」。'},
  {q:'The client requested that the report ___ by end of day.',choices:["A. submit", "B. submitted", "C. be submitted", "D. submitting"],answer:2,translation:'クライアントはレポートを本日中に提出するよう求めました。',explanation:'requested that節の中では仮定法現在（原形）を使います。be submitted が正解。'},
  {q:'Please make ___ that all forms are filled out correctly.',choices:["A. sure", "B. certain", "C. clear", "D. aware"],answer:0,translation:'全てのフォームが正しく記入されていることを確認してください。',explanation:'make sure that〜で「〜を確認する」という定型表現。sure が正解。'},
  {q:'The conference ___ over 500 participants from 30 countries.',choices:["A. attracted", "B. attraction", "C. attractive", "D. attractively"],answer:0,translation:'会議は30カ国から500人以上の参加者を集めました。',explanation:'主語 The conference に対する動詞が必要。attracted（引き付けた）が正解。'},
  {q:'The CEO\'s ___ inspired everyone in the company.',choices:["A. speak", "B. speech", "C. speaker", "D. spoken"],answer:1,translation:'CEOのスピーチは会社の全員を鼓舞しました。',explanation:'冠詞 The と所有格 CEO\'s の後ろには名詞が来ます。speech（スピーチ）が正解。'},
  {q:'Employees are encouraged to ___ new ideas during brainstorming sessions.',choices:["A. submit", "B. submission", "C. submitted", "D. submitting"],answer:0,translation:'社員はブレインストーミングセッションで新しいアイデアを提出するよう奨励されています。',explanation:'to の後ろには動詞の原形が来ます。submit（提出する）が正解。'},
  {q:'The company prides ___ on offering excellent customer service.',choices:["A. it", "B. its", "C. itself", "D. oneself"],answer:2,translation:'会社は優れた顧客サービスを提供することを誇りにしています。',explanation:'pride oneself on〜で「〜を誇りにする」という慣用表現。itself が正解。'},
  {q:'The meeting was ___ due to the manager\'s illness.',choices:["A. cancel", "B. cancellation", "C. canceled", "D. canceling"],answer:2,translation:'会議はマネージャーの病気のためにキャンセルされました。',explanation:'was の後ろには過去分詞が来て受動態を作ります。canceled（キャンセルされた）が正解。'},
  {q:'She has ___ ten years of experience in the field of marketing.',choices:["A. more", "B. over", "C. above", "D. beyond"],answer:1,translation:'彼女はマーケティング分野で10年以上の経験を持っています。',explanation:'数量を「超える」を表すには over が最も自然です。over ten years で「10年以上」。'},
  {q:'The new product line is ___ at young professionals.',choices:["A. aimed", "B. aiming", "C. aim", "D. aims"],answer:0,translation:'新しい製品ラインは若い専門職を対象としています。',explanation:'is aimed at〜で「〜を対象にしている」という受動態の表現。'},
  {q:'Customer complaints should be ___ as soon as possible.',choices:["A. address", "B. addressing", "C. addressed", "D. addresses"],answer:2,translation:'顧客の苦情はできるだけ早く対処されるべきです。',explanation:'should be の後ろには過去分詞が来て受動態を作ります。addressed（対処された）が正解。'},
  {q:'The report provides a ___ overview of the market trends.',choices:["A. detail", "B. detailed", "C. detailing", "D. detailedly"],answer:1,translation:'レポートは市場動向の詳細な概要を提供しています。',explanation:'名詞 overview を修飾するには形容詞が必要。detailed（詳細な）が正解。'},
  {q:'___ attending the workshop, participants will receive a certificate.',choices:["A. On", "B. After", "C. Upon", "D. While"],answer:2,translation:'ワークショップに参加するとすぐに、参加者は証明書を受け取ります。',explanation:'Upon〜ing で「〜するとすぐに」という表現。upon attending が正解。'},
  {q:'The team ___ hard to meet the deadline.',choices:["A. worked", "B. work", "C. is worked", "D. working"],answer:0,translation:'チームは締め切りに間に合わせるために一生懸命働きました。',explanation:'過去の行為を表す文。過去形 worked が正解。'},
  {q:'The ___ of the new office will take place next spring.',choices:["A. open", "B. opening", "C. openly", "D. opened"],answer:1,translation:'新しいオフィスのオープンは来春に行われます。',explanation:'冠詞 The の後ろには名詞が来ます。opening（オープン・開業）が正解。'},
  {q:'Please return the signed contract ___ the attached envelope.',choices:["A. from", "B. by", "C. in", "D. with"],answer:2,translation:'署名済みの契約書を同封の封筒に入れてご返送ください。',explanation:'in the envelope で「封筒の中に入れて」という意味になります。'},
  {q:'The conference room can ___ up to 50 people.',choices:["A. consist", "B. accommodate", "C. include", "D. contain"],answer:1,translation:'会議室は最大50人を収容できます。',explanation:'accommodate は「収容する」という意味で、施設の定員を述べるときに使う定番表現。'},
  {q:'The intern ___ a very positive impression on the entire team.',choices:["A. did", "B. gave", "C. made", "D. took"],answer:2,translation:'インターンはチーム全体にとても良い印象を与えました。',explanation:'make an impression で「印象を与える」という慣用表現。made が正解。'},
  {q:'The price of the product ___ slightly over the past year.',choices:["A. increased", "B. has increased", "C. is increasing", "D. increase"],answer:1,translation:'製品の価格は過去1年間で少し上昇しました。',explanation:'over the past year という期間を示す表現があるので、現在完了形 has increased が正解。'},
  {q:'The new employee was asked to ___ a brief introduction.',choices:["A. give", "B. given", "C. giving", "D. gives"],answer:0,translation:'新入社員は簡単な自己紹介をするよう求められました。',explanation:'was asked to の後ろには動詞の原形が来ます。give が正解。'},
  {q:'The company\'s success is largely ___ to its dedicated employees.',choices:["A. due", "B. owing", "C. because", "D. result"],answer:0,translation:'会社の成功は主に献身的な社員のおかげです。',explanation:'due to〜で「〜のおかげで」という表現。largely due to で「主に〜のおかげで」。'},
  {q:'___ is responsible for ensuring client satisfaction in your department?',choices:["A. Whose", "B. What", "C. Who", "D. Which"],answer:2,translation:'あなたの部門では誰が顧客満足を確保する責任がありますか？',explanation:'人を尋ねる疑問詞は Who。Who is responsible for〜で「誰が〜の責任者ですか？」。'},
  {q:'The product recall was ___ to a manufacturing defect.',choices:["A. attributed", "B. attribute", "C. attributing", "D. attribution"],answer:0,translation:'製品のリコールは製造上の欠陥に起因していました。',explanation:'was の後ろには過去分詞が来て受動態を作ります。be attributed to〜で「〜に起因する」。'},
  {q:'The CEO will ___ the quarterly results at tomorrow\'s meeting.',choices:["A. present", "B. presentation", "C. presenter", "D. presently"],answer:0,translation:'CEOは明日の会議で四半期の結果を発表します。',explanation:'will の後ろには動詞の原形が来ます。present（発表する）が正解。'},
  {q:'The document should be ___ in both English and Japanese.',choices:["A. prepare", "B. preparation", "C. prepared", "D. preparing"],answer:2,translation:'その文書は英語と日本語の両方で作成されるべきです。',explanation:'should be の後ろには過去分詞が来て受動態を作ります。prepared（作成された）が正解。'},
  {q:'Sales have been ___ declining since the new competitor entered the market.',choices:["A. steady", "B. steadied", "C. steadily", "D. steadiness"],answer:2,translation:'新しい競合他社が市場に参入して以来、売上は着実に減少しています。',explanation:'動詞 declining を修飾するには副詞が必要。steadily（着実に・継続的に）が正解。'},
  {q:'The training session has been ___ for next Monday.',choices:["A. schedule", "B. scheduled", "C. scheduling", "D. schedules"],answer:1,translation:'研修セッションは来週月曜日に予定されました。',explanation:'has been の後ろには過去分詞が来て現在完了受動態を作ります。scheduled（予定された）が正解。'},
  {q:'Please ___ any changes to the schedule as soon as possible.',choices:["A. communicate", "B. communication", "C. communicative", "D. communicated"],answer:0,translation:'スケジュールの変更はできるだけ早く伝えてください。',explanation:'Please の後ろには動詞の原形が来ます。communicate（伝える・知らせる）が正解。'},
  {q:'The revised budget was ___ by the finance committee last week.',choices:["A. approve", "B. approving", "C. approved", "D. approval"],answer:2,translation:'修正予算は先週、財務委員会によって承認されました。',explanation:'was の後ろには過去分詞が来て受動態を作ります。approved（承認された）が正解。'},
  {q:'Employees are strongly ___ to participate in the wellness program.',choices:["A. encourage", "B. encouraging", "C. encouragement", "D. encouraged"],answer:3,translation:'社員はウェルネスプログラムに参加するよう強く奨励されています。',explanation:'are の後ろには過去分詞が来て受動態を作ります。encouraged（奨励された）が正解。'},
  {q:'The store offers a full ___ if you are not satisfied with your purchase.',choices:["A. refund", "B. refunding", "C. refunded", "D. refunds"],answer:0,translation:'購入品に満足できない場合は全額返金します。',explanation:'冠詞 a の後ろには単数名詞が来ます。refund（返金）が正解。'},
  {q:'The committee ___ a decision on the proposal next week.',choices:["A. will make", "B. will be made", "C. making", "D. made"],answer:0,translation:'委員会は来週、提案について決定を下します。',explanation:'主語 The committee が「決定する」側なので能動態。未来の予定なので will make が正解。'},
  {q:'She was ___ for her outstanding contribution to the project.',choices:["A. reward", "B. rewarded", "C. rewarding", "D. rewards"],answer:1,translation:'彼女はプロジェクトへの卓越した貢献に対して報われました。',explanation:'was の後ろには過去分詞が来て受動態を作ります。rewarded（報われた）が正解。'},
  {q:'The company\'s new product has received ___ reviews from customers.',choices:["A. favor", "B. favorable", "C. favorably", "D. favoring"],answer:1,translation:'会社の新製品は顧客から好意的なレビューを受けています。',explanation:'名詞 reviews を修飾するには形容詞が必要。favorable（好意的な）が正解。'},
  {q:'Reservations must be made at ___ two weeks in advance.',choices:["A. least", "B. last", "C. most", "D. best"],answer:0,translation:'予約は少なくとも2週間前に行う必要があります。',explanation:'at least で「少なくとも」という定型表現。'},
  {q:'The project manager ___ all team members about the schedule change.',choices:["A. noticed", "B. noted", "C. notified", "D. reminded"],answer:2,translation:'プロジェクトマネージャーはスケジュール変更について全チームメンバーに通知しました。',explanation:'notify + 人 + about〜で「人に〜について通知する」。notified が正解。'},
  {q:'___ the budget cuts, the team managed to complete the project.',choices:["A. Because of", "B. In spite of", "C. Due to", "D. As a result of"],answer:1,translation:'予算削減にもかかわらず、チームはプロジェクトを完了させました。',explanation:'「〜にもかかわらず」という逆接を表すには In spite of が正解。'},
  {q:'The updated manual has been ___ to all department heads.',choices:["A. circulated", "B. circulation", "C. circulating", "D. circulate"],answer:0,translation:'更新されたマニュアルは全部門長に配布されました。',explanation:'has been の後ろには過去分詞が来て現在完了受動態を作ります。circulated（配布された）が正解。'},
  {q:'We are pleased to ___ that Mr. Kim has been appointed as CEO.',choices:["A. announce", "B. announcement", "C. announced", "D. announcing"],answer:0,translation:'キム氏がCEOに任命されたことをお知らせできることを嬉しく思います。',explanation:'pleased to の後ろには動詞の原形が来ます。announce（発表する）が正解。'},
  {q:'Shipping charges ___ on the size and weight of the package.',choices:["A. depend", "B. depends", "C. depending", "D. depended"],answer:0,translation:'送料はパッケージのサイズと重量によって決まります。',explanation:'主語 Shipping charges は複数形なので三単現の s は不要。depend on〜で「〜によって決まる」。'},
  {q:'All employees are ___ to complete the online safety course.',choices:["A. obligation", "B. obligate", "C. obligated", "D. obligatory"],answer:2,translation:'全社員はオンライン安全コースを修了することが義務付けられています。',explanation:'are の後ろには形容詞または過去分詞が来ます。obligated（義務付けられた）が正解。'},
  {q:'The renovation project is expected to be ___ by the end of the year.',choices:["A. complete", "B. completing", "C. completed", "D. completion"],answer:2,translation:'改装プロジェクトは今年末までに完了する予定です。',explanation:'be expected to be の後ろには過去分詞が来て受動態を作ります。completed が正解。'},
  {q:'Ms. Garcia was ___ that her proposal had been accepted.',choices:["A. delight", "B. delighted", "C. delightful", "D. delightfully"],answer:1,translation:'ガルシアさんは自分の提案が受け入れられたことを喜んでいました。',explanation:'was の後ろには形容詞が来ます。人が喜ぶ場合は delighted（喜んでいる）が正解。'},
  {q:'The company has decided to ___ its investment in renewable energy.',choices:["A. expand", "B. expansion", "C. expanding", "D. expanded"],answer:0,translation:'会社は再生可能エネルギーへの投資を拡大することを決定しました。',explanation:'to の後ろには動詞の原形が来ます。expand（拡大する）が正解。'},
  {q:'There ___ a significant increase in the number of online orders.',choices:["A. is", "B. are", "C. has been", "D. have been"],answer:2,translation:'オンライン注文の数に大きな増加がありました。',explanation:'a significant increase は単数なので has been が正解。現在完了形で現在までの変化を表します。'},
  {q:'The manager decided to ___ the project deadline by one week.',choices:["A. extend", "B. extension", "C. extensive", "D. extensively"],answer:0,translation:'マネージャーはプロジェクトの締め切りを1週間延長することを決めました。',explanation:'to の後ろには動詞の原形が来ます。extend（延長する）が正解。'},
  {q:'Mr. Lee suggested ___ the meeting to include more participants.',choices:["A. postpone", "B. postponed", "C. postponing", "D. to postpone"],answer:2,translation:'リーさんはより多くの参加者を含めるために会議を延期することを提案しました。',explanation:'suggest の後ろには動名詞（〜ing形）が来ます。postponing が正解。'},
  {q:'The finance team is ___ preparing the annual budget.',choices:["A. current", "B. currently", "C. currency", "D. currents"],answer:1,translation:'財務チームは現在、年次予算を作成中です。',explanation:'動詞 preparing を修飾するには副詞が必要。currently（現在・今のところ）が正解。'},
  {q:'All visitors ___ sign in at the reception desk upon arrival.',choices:["A. must", "B. are able to", "C. are allowed to", "D. are permitted"],answer:0,translation:'全ての訪問者は到着時に受付でサインインしなければなりません。',explanation:'義務・必須を表すには must が正解。'},
  {q:'The new policy ___ to all employees regardless of position.',choices:["A. apply", "B. applies", "C. applied", "D. applying"],answer:1,translation:'新しい方針はポジションにかかわらず全社員に適用されます。',explanation:'主語 The new policy は三人称単数なので applies が正解。apply to〜で「〜に適用される」。'},
  {q:'The product ___ is scheduled to take place in the main conference room.',choices:["A. launch", "B. launched", "C. launching", "D. launches"],answer:0,translation:'製品発表会はメイン会議室で行われる予定です。',explanation:'The product launch で「製品発表会」という複合名詞。launch（発売・発表）が正解。'},
  {q:'We are ___ to announce the opening of our new branch.',choices:["A. please", "B. pleasing", "C. pleased", "D. pleasure"],answer:2,translation:'新しい支店の開設をお知らせできることをうれしく思います。',explanation:'be pleased to do で「〜できることを嬉しく思う」という表現。pleased が正解。'},
  {q:'Please ___ that all safety procedures are followed during the inspection.',choices:["A. ensure", "B. assurance", "C. ensuring", "D. ensured"],answer:0,translation:'検査中は全ての安全手順が守られるよう確認してください。',explanation:'Please の後ろには動詞の原形が来ます。ensure（確認する・保証する）が正解。'},
  {q:'The client meeting has been ___ to 3:00 PM tomorrow.',choices:["A. reschedule", "B. rescheduled", "C. rescheduling", "D. reschedules"],answer:1,translation:'クライアントとの会議は明日の午後3時に変更されました。',explanation:'has been の後ろには過去分詞が来て現在完了受動態を作ります。rescheduled（変更された）が正解。'},
  {q:'The new employee showed great ___ in completing all assigned tasks.',choices:["A. initiative", "B. initiate", "C. initiating", "D. initially"],answer:0,translation:'新入社員は割り当てられた全タスクを完了する際に素晴らしい主体性を発揮しました。',explanation:'冠詞 great の後ろには名詞が来ます。initiative（主体性・自発性）が正解。'},
  {q:'The quarterly sales report ___ that revenue has increased by 12%.',choices:["A. show", "B. shows", "C. showing", "D. shown"],answer:1,translation:'四半期販売報告書は収益が12%増加したことを示しています。',explanation:'主語 The quarterly sales report は三人称単数なので shows が正解。'},
  {q:'We would appreciate it ___ you could provide feedback on the proposal.',choices:["A. when", "B. if", "C. though", "D. unless"],answer:1,translation:'提案についてフィードバックをいただけると幸いです。',explanation:'We would appreciate it if〜で「〜していただけると幸いです」という丁寧な表現。'},
  {q:'The company ___ a new partnership with a leading technology firm.',choices:["A. announced", "B. announcement", "C. announcing", "D. announces"],answer:0,translation:'会社は大手テクノロジー企業との新しいパートナーシップを発表しました。',explanation:'過去の出来事を述べる文。過去形 announced が正解。'},

    { id:'p5', name:'Part 5 文法・語彙', hint:'ランダム出題 · 10問', time:'10分', quiz:true, qtype:'part5', qcount:10 },

  ],
  '60': [
    { id:'p5', name:'Part 5 文法・語彙', hint:'ランダム出題 · 10問', time:'10分', quiz:true, qtype:'part5', qcount:10 },
    { id:'vocab', name:'単語学習', hint:'ランダム出題 · 20語', time:'10分', vocab:true },
    { id:'p7', name:'Part 7 長文読解', hint:'ランダム出題 · 3セット', time:'20分', quiz:true, qtype:'part7', qcount:9 },
    { id:'review', name:'音読 & 復習', hint:'間違えた箇所の文を音読', time:'20分', quiz:false },
  ]
};

const DAYS = ['日','月','火','水','木','金','土'];
let state = {};
try { state = JSON.parse(localStorage.getItem('toeic_v5') || '{}'); } catch(e) {}
function save() { try { localStorage.setItem('toeic_v5', JSON.stringify(state)); } catch(e) {} }

const base = new Date(); base.setHours(0,0,0,0);
let offset = 0;
let currentQuizTaskId = null;
let quizQuestions = [];
let quizAnswers = [];
let quizIdx = 0;
let quizAnswered = false;

function dayKey(o) { const d = new Date(base); d.setDate(d.getDate()+o); return d.toISOString().slice(0,10); }
function dayState(k) {
  if (!state[k]) state[k] = { mode:'60', done:{}, scores:{} };
  if (!state[k].scores) state[k].scores = {};
  return state[k];
}
function setMode(m) { if (offset!==0) return; dayState(dayKey(0)).mode=m; save(); render(); }
function changeDay(d) { const n=offset+d; if(n>0)return; offset=n; render(); }
function calcStreak() {
  let s=0;
  for(let i=0;i>=-365;i--){
    const k=dayKey(i),ds=state[k]; if(!ds)break;
    const tasks=TASKS[ds.mode||'60'];
    if(tasks.every(t=>ds.done[t.id]))s++; else if(i<0)break;
  }
  return s;
}
function showScreen(id) { document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); document.getElementById(id).classList.add('active'); }

function shuffle(arr) { const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

function buildQuestions(qtype, qcount) {
  if (qtype === 'part5') {
    return shuffle(PART5_BANK).slice(0, Math.min(qcount, PART5_BANK.length));
  } else {
    // Part7: pick random passages and flatten questions
    const shuffledSets = shuffle(PART7_BANK);
    const result = [];
    for (const set of shuffledSets) {
      const qs = set.questions.map((q, i) => ({
        passage: set.passage,
        q: q.q, choices: q.choices, answer: q.answer, explanation: q.explanation
      }));
      result.push(...qs);
      if (result.length >= qcount) break;
    }
    return result.slice(0, qcount);
  }
}

// ===== HOME RENDER =====
function render() {
  const key=dayKey(offset), ds=dayState(key), isToday=offset===0;
  const tasks=TASKS[ds.mode||'60'];
  const d=new Date(base); d.setDate(d.getDate()+offset);
  const m=d.getMonth()+1, dd=d.getDate(), dow=DAYS[d.getDay()];
  document.getElementById('date-text').textContent=`${m}月${dd}日（${dow}）`;
  document.getElementById('today-label').textContent=isToday?'TODAY':'';
  document.getElementById('prev-btn').disabled=offset<=-30;
  document.getElementById('next-btn').disabled=offset>=0;
  document.getElementById('btn-30').className='mode-btn'+(ds.mode==='30'?' active':'');
  document.getElementById('btn-60').className='mode-btn'+(ds.mode==='60'?' active':'');
  document.getElementById('btn-30').disabled=!isToday;
  document.getElementById('btn-60').disabled=!isToday;

  const list=document.getElementById('task-list'); list.innerHTML='';
  const doneCount=tasks.filter(t=>ds.done[t.id]).length;

  tasks.forEach(t => {
    const done=!!ds.done[t.id], score=ds.scores[t.id];
    if (t.quiz && isToday) {
      const el=document.createElement('div');
      el.className='quiz-launch'+(done?' done':'');
      if (!done) el.onclick=()=>startQuiz(t);
      else el.style.cursor='default';
      const scoreStr=done&&score?`<span class="quiz-score-badge">${score.correct}/${score.total}問正解</span>`:'';
      el.innerHTML=`<div class="quiz-launch-icon"><svg viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h4"/></svg></div><div class="quiz-launch-body"><div class="quiz-launch-name">${t.name}</div><div class="quiz-launch-hint">${done?'完了 '+scoreStr:t.hint}</div></div><span class="quiz-launch-time">${t.time}</span>`;
      list.appendChild(el);
    } else if (t.vocab && isToday) {
      const el=document.createElement('div');
      el.className='vocab-launch'+(done?' done':'');
      if(!done) el.onclick=()=>startVocab(t); else el.style.cursor='default';
      el.innerHTML=`<div class="vocab-launch-icon"><svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></div><div class="vocab-launch-body"><div class="vocab-launch-name">${t.name}</div><div class="vocab-launch-hint">${done?'完了':t.hint}</div></div><span class="vocab-launch-time">${t.time}</span>`;
      list.appendChild(el);
    } else {
      const el=document.createElement('div');
      el.className='task-item'+(done?' done':'');
      if(isToday) el.onclick=()=>{ds.done[t.id]=!ds.done[t.id];save();render();};
      el.innerHTML=`<div class="task-check"><svg class="check-icon" viewBox="0 0 14 14"><polyline points="2,7 6,11 12,3"/></svg></div><div class="task-body"><div class="task-name">${t.name}</div><div class="task-hint">${t.hint}</div></div><span class="task-time">${t.time}</span>`;
      list.appendChild(el);
    }
  });

  if(doneCount===tasks.length){
    const msg=document.createElement('div'); msg.className='all-done show';
    msg.innerHTML='<div class="all-done-icon">🎯</div><div class="all-done-text">トレーニング完了！</div><div class="all-done-sub">今日も700点に近づいた</div>';
    list.appendChild(msg);
  }

  const pct=tasks.length?Math.round(doneCount/tasks.length*100):0;
  document.getElementById('progress-pct').textContent=pct+'%';
  document.getElementById('progress-fill').style.width=pct+'%';
  document.getElementById('streak-num').textContent=calcStreak();

  const dots=document.getElementById('week-dots'); dots.innerHTML='';
  for(let i=-6;i<=0;i++){
    const k=dayKey(i),ds2=state[k];
    const tasks2=TASKS[(ds2&&ds2.mode)||'60'];
    const done2=ds2&&tasks2.every(t=>ds2.done[t.id]);
    const isToday2=i===0;
    const d2=new Date(base); d2.setDate(d2.getDate()+i);
    const dot=document.createElement('div');
    dot.className='week-dot'+(done2?' done':'')+(isToday2?' today':'');
    dot.innerHTML=`<span class="dot-day">${DAYS[d2.getDay()]}</span><svg class="dot-icon" viewBox="0 0 14 14">${done2?'<polyline points="2,7 6,11 12,3" stroke-width="2"/>':'<circle cx="7" cy="7" r="3" fill="currentColor" opacity="0.3"/>'}</svg>`;
    dots.appendChild(dot);
  }
}

// ===== QUIZ =====
function startQuiz(task) {
  currentQuizTaskId=task.id;
  quizQuestions=buildQuestions(task.qtype, task.qcount);
  quizAnswers=[];
  quizIdx=0;
  quizAnswered=false;
  document.getElementById('quiz-title').textContent=task.name;
  showScreen('screen-quiz');
  renderQuestion();
}

function renderQuestion() {
  const total=quizQuestions.length, q=quizQuestions[quizIdx];
  quizAnswered=false;
  document.getElementById('quiz-prog-fill').style.width=Math.round((quizIdx/total)*100)+'%';

  // Part7: passage always shown, collapsed by default after Q1
  const isFirstInPassage = quizIdx === 0 || quizQuestions[quizIdx-1].passage !== q.passage;
  const passageHtml = q.passage ? `
    <details class="q-passage-details" ${isFirstInPassage ? 'open' : ''}>
      <summary class="q-passage-summary">📄 問題文を見る</summary>
      <div class="q-passage">${q.passage}</div>
    </details>` : '';
  const translationHtml=q.translation?`<div class="q-translation">📝 ${q.translation}</div>`:'';
  const choicesHtml=q.choices.map((c,i)=>`<div class="q-choice" id="choice-${i}" onclick="selectAnswer(${i})"><div class="q-choice-label">${String.fromCharCode(65+i)}</div><div class="q-choice-text">${c.replace(/^[A-D]\.\s*/,'')}</div></div>`).join('');

  document.getElementById('quiz-body').innerHTML=`
    <div class="q-meta"><span class="q-num">${quizIdx+1}</span> / ${total}</div>
    ${passageHtml}
    <div class="q-text">${q.q}</div>
    ${translationHtml}
    <div class="q-choices">${choicesHtml}</div>
    <div class="q-explanation" id="q-explanation">
      <div class="q-exp-label">日本語訳</div>
      <div id="q-translation" style="margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid rgba(37,99,235,0.15)"></div>
      <div class="q-exp-label">解説</div>
      <div id="q-exp-text"></div>
    </div>
    <div class="q-nav"><button class="q-btn" id="next-btn-quiz" onclick="nextQuestion()" disabled>${quizIdx+1<total?'次の問題 →':'結果を見る'}</button></div>
  `;
}

function selectAnswer(idx) {
  if(quizAnswered)return;
  quizAnswered=true;
  const q=quizQuestions[quizIdx], correct=q.answer;
  quizAnswers.push({selected:idx, correct});
  for(let i=0;i<q.choices.length;i++){
    const el=document.getElementById('choice-'+i);
    if(i===correct){el.classList.add('correct');el.innerHTML+='<span class="q-result-icon">✓</span>';}
    else if(i===idx&&idx!==correct){el.classList.add('wrong');el.innerHTML+='<span class="q-result-icon">✗</span>';}
  }
  document.getElementById('q-translation').textContent=q.translation||'';
  document.getElementById('q-exp-text').textContent=q.explanation;
  document.getElementById('q-explanation').classList.add('show');
  document.getElementById('next-btn-quiz').disabled=false;
}

function nextQuestion() {
  quizIdx++;
  if(quizIdx<quizQuestions.length) renderQuestion(); else showResult();
}

function showResult() {
  const total=quizAnswers.length;
  const correctCount=quizAnswers.filter(a=>a.selected===a.correct).length;
  const pct=Math.round(correctCount/total*100);
  const key=dayKey(offset), ds=dayState(key);
  ds.done[currentQuizTaskId]=true;
  ds.scores[currentQuizTaskId]={correct:correctCount,total};
  save();

  const msg=pct>=80?'🎉 素晴らしい！':pct>=60?'👍 なかなか良い！':'📚 復習しよう';
  const color=pct>=80?'var(--success)':pct>=60?'var(--accent)':'var(--danger)';

  const reviewHtml=quizQuestions.map((q,i)=>{
    const ans=quizAnswers[i], ok=ans&&ans.selected===ans.correct;
    const shortQ=q.q.length>36?q.q.slice(0,36)+'…':q.q;
    const passageHtml=q.passage?`<div class="review-passage">${q.passage}</div>`:'';
    const choicesHtml=q.choices.map((c,ci)=>{
      const label=String.fromCharCode(65+ci), text=c.replace(/^[A-D]\.\s*/,'');
      const isCorrect=ci===q.answer, isWrongPick=ans&&ci===ans.selected&&!isCorrect;
      const cls=isCorrect?'is-correct':isWrongPick?'is-wrong-pick':'';
      const icon=isCorrect?' ✓':isWrongPick?' ✗':'';
      return `<div class="review-choice-row ${cls}"><span class="review-choice-label">${label}${icon}</span><span class="review-choice-text">${text}</span></div>`;
    }).join('');
    return `<div class="review-card ${ok?'correct-card':'wrong'}" id="rc-${i}">
      <div class="review-header" onclick="toggleReview(${i})">
        <span class="review-ox">${ok?'⭕':'❌'}</span>
        <span class="review-qnum">${i+1}</span>
        <span class="review-qtext">${shortQ}</span>
        <span class="review-chevron">▼</span>
      </div>
      <div class="review-detail">
        ${passageHtml}
        <div class="review-full-q">${q.q}</div>
        ${q.translation?`<div style="font-size:12px;color:var(--muted);margin:-6px 0 10px;line-height:1.6">${q.translation}</div>`:''}
        <div class="review-choices-list">${choicesHtml}</div>
        <div class="review-exp-box"><div class="review-exp-label">解説</div>${q.explanation}</div>
      </div>
    </div>`;
  }).join('');

  document.getElementById('result-body').innerHTML=`
    <div class="result-score-card">
      <div class="result-score-label">スコア</div>
      <div class="result-score-num" style="color:${color}">${correctCount}<span class="result-score-total"> / ${total}</span></div>
      <div class="result-score-pct">${pct}% 正解</div>
      <div class="result-score-msg">${msg}</div>
    </div>
    <div style="margin-bottom:20px">
      <div class="result-breakdown-title">問題ごとの結果　<span style="font-size:11px;color:var(--muted);font-family:var(--mono)">タップで答え・解説を表示</span></div>
      ${reviewHtml}
    </div>
    <button class="result-done-btn" onclick="exitResult()">トレーニングに戻る</button>
    <div style="height:20px"></div>
  `;

  quizAnswers.forEach((a,i)=>{ if(a.selected!==a.correct) toggleReview(i); });
  showScreen('screen-result');
}

function toggleReview(i) { const c=document.getElementById('rc-'+i); if(c)c.classList.toggle('open'); }
function exitQuiz() { showScreen('screen-home'); render(); }
function exitResult() { showScreen('screen-home'); render(); }

if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
render();

// ===== VOCAB =====
let vocabCategory = 'all';

function startVocab(task) {
  currentQuizTaskId=task.id;
  vocabCategory='all';
  showScreen('screen-vocab');
  renderVocabCategory();
}

function renderVocabCategory() {
  const cats = ['all','動詞','名詞','形容詞','副詞','接続詞','前置詞'];
  const labels = {all:'すべて', '動詞':'動詞', '名詞':'名詞', '形容詞':'形容詞', '副詞':'副詞', '接続詞':'接続詞', '前置詞':'前置詞'};
  const counts = {};
  cats.forEach(c => {
    counts[c] = c==='all' ? VOCAB_BANK.length : VOCAB_BANK.filter(w=>w.pos===c).length;
  });
  const btnHtml = cats.map(c => `
    <button onclick="selectVocabCat('${c}')" style="
      flex:1; padding:10px 6px; border-radius:10px; font-family:var(--sans); font-size:13px; cursor:pointer;
      border: 1.5px solid ${vocabCategory===c ? 'var(--accent)' : 'var(--border)'};
      background: ${vocabCategory===c ? 'var(--accent-dim)' : 'var(--surface)'};
      color: ${vocabCategory===c ? 'var(--accent)' : 'var(--muted)'};
      font-weight: ${vocabCategory===c ? '500' : '400'};
    ">${labels[c]}<br><span style="font-size:10px;font-family:var(--mono)">${counts[c]}語</span></button>
  `).join('');

  const filtered = vocabCategory==='all' ? VOCAB_BANK : VOCAB_BANK.filter(w=>w.pos===vocabCategory);
  const available = filtered.length;

  document.getElementById('vocab-body').innerHTML=`
    <div style="padding:0 0 16px">
      <div style="font-size:12px;color:var(--muted);margin-bottom:10px;font-family:var(--mono);letter-spacing:0.06em;text-transform:uppercase">カテゴリを選択</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">${btnHtml}</div>
    </div>
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:16px">
      <div style="font-size:13px;color:var(--text);margin-bottom:4px;font-weight:500">${vocabCategory==='all'?'すべての単語':vocabCategory} <span style="font-family:var(--mono);color:var(--accent)">${available}語</span></div>
      <div style="font-size:12px;color:var(--muted)">ランダムに20語出題（${available<20?available:20}語）</div>
    </div>
    <button class="vocab-btn primary" onclick="startVocabStudy()" style="width:100%;margin-bottom:8px">学習スタート →</button>
    <button class="vocab-btn" onclick="exitVocab()" style="width:100%">戻る</button>
  `;
  document.getElementById('vocab-prog-fill').style.width='0%';
}

function selectVocabCat(cat) {
  vocabCategory = cat;
  renderVocabCategory();
}

function startVocabStudy() {
  const filtered = vocabCategory==='all' ? VOCAB_BANK : VOCAB_BANK.filter(w=>w.pos===vocabCategory);
  vocabWords = shuffle(filtered).slice(0, Math.min(20, filtered.length));
  vocabIdx = 0;
  renderVocab();
}

function renderVocab() {
  const total=vocabWords.length, w=vocabWords[vocabIdx];
  document.getElementById('vocab-prog-fill').style.width=Math.round((vocabIdx/total)*100)+'%';
  document.getElementById('vocab-body').innerHTML=`
    <div class="vocab-progress-row">
      <span class="vocab-progress-label">${vocabIdx+1} / ${total}</span>
      <span style="font-size:11px;color:var(--muted);font-family:var(--mono)">${vocabCategory==='all'?'すべて':vocabCategory}</span>
    </div>
    <div class="vocab-card">
      <div class="vocab-word">${w.word}</div>
      <div class="vocab-pos">${w.pos}</div>
      <div class="vocab-meaning">${w.meaning}</div>
      <div class="vocab-example">${w.example}</div>
      <div class="vocab-example-ja">${w.example_ja}</div>
    </div>
    <div class="vocab-nav">
      <button class="vocab-btn" onclick="prevVocab()" ${vocabIdx===0?'disabled':''}>← 前へ</button>
      <button class="vocab-btn primary" onclick="nextVocab()">${vocabIdx+1<total?'次へ →':'完了'}</button>
    </div>
  `;
}
function nextVocab() { if(vocabIdx+1<vocabWords.length){vocabIdx++;renderVocab();}else{finishVocab();} }
function prevVocab() { if(vocabIdx>0){vocabIdx--;renderVocab();} }
function finishVocab() {
  const key=dayKey(offset),ds=dayState(key);
  ds.done[currentQuizTaskId]=true; save();
  showVocabResult();
}

function showVocabResult() {
  document.getElementById('vocab-prog-fill').style.width='100%';
  const listHtml = vocabWords.map((w,i) => `
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:8px;cursor:pointer;-webkit-tap-highlight-color:transparent" onclick="this.querySelector('.vocab-review-detail').style.display=this.querySelector('.vocab-review-detail').style.display==='none'?'block':'none'">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
        <div>
          <span style="font-size:15px;font-weight:700;color:var(--text)">${w.word}</span>
          <span style="font-size:11px;color:var(--muted);font-family:var(--mono);margin-left:8px">${w.pos}</span>
        </div>
        <span style="font-size:13px;color:var(--accent);font-weight:500;flex-shrink:0">${w.meaning}</span>
      </div>
      <div class="vocab-review-detail" style="display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)">
        <div style="font-size:13px;color:var(--muted);font-style:italic;margin-bottom:6px">${w.example}</div>
        <div style="font-size:12px;color:var(--muted);padding-top:8px;border-top:1px solid var(--border)">${w.example_ja}</div>
      </div>
    </div>
  `).join('');

  document.getElementById('vocab-body').innerHTML=`
    <div style="text-align:center;padding:16px 0 20px">
      <div style="font-size:36px;margin-bottom:8px">📚</div>
      <div style="font-size:17px;font-weight:700;color:var(--accent);margin-bottom:4px">${vocabWords.length}語 完了！</div>
      <div style="font-size:12px;color:var(--muted);margin-bottom:16px">タップで例文を確認できます</div>
      <div style="display:flex;gap:8px;margin-bottom:20px">
        <button class="vocab-btn primary" onclick="startVocabStudy()" style="flex:1">もう一度</button>
        <button class="vocab-btn" onclick="renderVocabCategory()" style="flex:1">カテゴリへ</button>
      </div>
    </div>
    ${listHtml}
    <div style="height:16px"></div>
  `;
}
function exitVocab() { showScreen('screen-home'); render(); }
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
render();
</script>
</body>
</html>
